<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethio Telegram Ads</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--tg-theme-bg-color, #f4f6f8);
      color: var(--tg-theme-text-color, #222);
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 6px;
    }
    p.subtitle {
      font-size: 13px;
      color: #666;
      margin-top: 0;
    }
    .grid {
      display: grid;
      gap: 14px;
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card h3 {
      margin: 0 0 6px 0;
      font-size: 17px;
    }
    .card a {
      color: #0088cc;
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 12px;
      word-break: break-all;
    }
    .price {
      font-size: 18px;
      font-weight: bold;
      color: #2e7d32;
      margin-bottom: 12px;
    }
    .btn {
      background-color: #0088cc;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .loading {
      text-align: center;
      color: #777;
      font-size: 15px;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <header>
    <h1>የቴሌግራም ቻናል ማስታወቂያዎች</h1>
    <p class="subtitle">የሚፈልጉትን ቻናል መርጠው በቀጥታ በቦቱ ያዝዙ</p>
  </header>

  <div id="channel-list" class="grid">
    <div class="loading">ቻናሎች እየተጫኑ ነው...</div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // ከ Render ሰርቨር የተመዘገቡትን ቻናሎች ያመጣል
    fetch('https://ethio-ad-bot-wz6h.onrender.com/api/channels')
      .then(response => response.json())
      .then(channels => {
        const container = document.getElementById('channel-list');
        container.innerHTML = '';

        if (channels.length === 0) {
          container.innerHTML = '<div class="loading">እስካሁን የተመዘገበ ቻናል የለም።</div>';
          return;
        }

        channels.forEach(ch => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div>
              <h3>📢 ${ch.channel_name}</h3>
              <a href="${ch.channel_link}" target="_blank">${ch.channel_link}</a>
            </div>
            <div class="price">${ch.final_price} ብር / 24 ሰዓት</div>
            <a class="btn" href="https://t.me/EthioAdvert_bot?start=buy_${ch.id}">ይህን ቻናል ይዘዙ</a>
          `;
          container.appendChild(card);
        });
      })
      .catch(error => {
        console.error('Error fetching channels:', error);
        document.getElementById('channel-list').innerHTML = 
          '<div class="loading">መረጃዎችን መጫን አልተቻለም። እባክዎ እንደገና ይሞክሩ።</div>';
      });
  </script>
</body>
</html>
