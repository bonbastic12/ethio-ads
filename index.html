<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethio Telegram Ads</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--tg-theme-bg-color, #18222d);
      color: var(--tg-theme-text-color, #ffffff);
    }
    h1 {
      font-size: 19px;
      text-align: center;
      margin-bottom: 20px;
      color: #24A1DE;
    }
    .card {
      background: #232e3c;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 15px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }
    .title {
      font-size: 17px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .detail {
      font-size: 14px;
      color: #8fa0af;
      margin-bottom: 6px;
    }
    .price {
      font-weight: bold;
      color: #4cd964;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .btn {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
    }
    .btn-visit {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
    .btn-order {
      background: #24A1DE;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <h1>📢 የቴሌግራም ቻናሎች ዝርዝር</h1>

  <!-- ቻናል 1 -->
  <div class="card">
    <div class="title">MR ODDS (ቢዝነስ)</div>
    <div class="detail">👥 ተከታዮች፦ 946</div>
    <div class="detail">💰 ዋጋ፦ <span class="price">1,500 ብር / 24 ሰዓት</span></div>
    
    <div class="btn-group">
      <a href="https://t.me/MRBENJA12" class="btn btn-visit" target="_blank">ቻናሉን እይ</a>
      <a href="https://t.me/EthioAdvert_bot?text=MR%20ODDS%20ቻናል%20ላይ%20ማስታወቂያ%20ማስነገር%20እፈልጋለሁ" class="btn btn-order">ማስታወቂያ እዘዝ</a>
    </div>
  </div>

</body>
</html>
