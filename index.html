<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethio Telegram Ads</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--tg-theme-bg-color, #f4f6f8);
      color: var(--tg-theme-text-color, #222);
    }
    h1 {
      font-size: 20px;
      text-align: center;
      margin-bottom: 20px;
      color: #0088cc;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .detail {
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
    }
    .price {
      font-weight: bold;
      color: #28a745;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background-color: #0088cc;
      color: white;
      text-decoration: none;
      padding: 10px 0;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>📢 የቴሌግራም ቻናሎች ዝርዝር</h1>

  <!-- ቻናል 1 -->
  <div class="card">
    <div class="title">MR ODDS (ቢዝነስ)</div>
    <div class="detail">👥 ተከታዮች፦ 946</div>
    <div class="detail">💰 ዋጋ፦ <span class="price">1,500 ብር / 24 ሰዓት</span></div>
    <a href="https://t.me/MRBENJA12" class="btn">ቻናሉን ጎብኝ</a>
  </div>

  <!-- ተጨማሪ ቻናሎች ሲመጡ እዚህ ጋር ይቀጥላሉ -->

</body>
</html>
